name: Android app

on:
  push:
    paths: [ "app/**", "gradle/**", "*.kts", "gradle.properties", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "app/**", "gradle/**", "*.kts", "gradle.properties", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testQaUnitTest assembleDebug assembleQa assemblePersonal
      - uses: actions/upload-artifact@v4
        with:
          name: Svalka-android-debug
          path: app/build/outputs/apk/*/*.apk
          retention-days: 30
      # Small separate download with just the build that updates the installed app (after re-signing with the owner's key).
      - uses: actions/upload-artifact@v4
        with:
          name: Svalka-android-personal
          path: app/build/outputs/apk/personal/*.apk
          retention-days: 30
