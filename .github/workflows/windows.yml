name: Windows app

on:
  push:
    paths: [ "windows/**", ".github/workflows/windows.yml" ]
  pull_request:
    paths: [ "windows/**", ".github/workflows/windows.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test windows/tests/Svalka.Core.Tests -c Release
      - name: Publish single exe
        run: >
          dotnet publish windows/src/Svalka.Desktop -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Svalka-windows
          path: publish/Svalka.exe
          retention-days: 30
